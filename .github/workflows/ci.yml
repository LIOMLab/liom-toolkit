name: CI

# CI runs on PRs to main (the develop→main merge gate) and on pushes to
# main (to confirm main stays green after a merge). Pushes to develop do
# NOT trigger CI — work happens on develop and the gate fires when the PR
# is opened.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least-privilege default; no ci.yml job needs write access

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "lint-3.14"
          cache-python: true
          python-version: "3.14"   # lint on the highest supported version
      - run: uv sync                   # installs dev group (ruff, ty) + core deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      # ty is hard-gated: a non-zero ty exit fails the lint job. ty is
      # configured with error-on-warning = false, so only error-severity
      # diagnostics fail CI; warnings (third-party stub friction, numpy
      # ArrayLike union noise) are reported but non-gating.
      - run: uv run ty check

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Two gating legs, both with all extras (ai + antspy):
        #   3.12+all — antspyx 0.6.3 from PyPI (cp312 wheel)
        #   3.14+all — antspyx 0.6.4 from this repo's antspyx-cp314 wheel
        #              release (flat index in [tool.uv.sources])
        # Both legs install torch + ants, so importorskip-gated tests run
        # for real and the 60% coverage gate (from pyproject.toml addopts)
        # is enforced on both.
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "${{ matrix.python-version }}-all"
          cache-python: true
          python-version: "${{ matrix.python-version }}"
      - run: uv sync --extra all
      # Both legs run the full suite with the 60% coverage gate from
      # pyproject.toml addopts. antspyx is installed on both, so
      # @pytest.mark.antspy real round-trip tests run (not deselected).
      - run: uv run pytest -q
        env:
          CI: "true"   # hypothesis CI profile auto-activates
