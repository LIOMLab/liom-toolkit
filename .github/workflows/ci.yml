name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv python install 3.14   # lint on the highest supported version
      - run: uv sync                   # installs dev group (ruff, ty) + core deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      # ty baseline only — not gated in this phase. continue-on-error so a
      # non-zero ty exit does not block. Gating is a later phase (LINT-02).
      - run: uv run ty check
        continue-on-error: true

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        install-scope: ["core", "all"]
        # 3.12+all and 3.14+core are GATING; 3.14+all is BEST-EFFORT.
        # 3.12+core is redundant with 3.12+all (all includes core) — drop it
        # to keep the matrix at 3 jobs: 3.12+all, 3.14+core, 3.14+all.
        exclude:
          - python-version: "3.12"
            install-scope: "core"
        include:
          - python-version: "3.14"
            install-scope: "all"
            continue-on-error: true   # antspyx source build on 3.14 (no wheel) — non-gating
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (core)
        if: matrix.install-scope == 'core'
        run: uv sync --no-all-extras
      - name: Install dependencies (all extras)
        if: matrix.install-scope == 'all'
        run: uv sync --extra all
      # Run pytest on both 3.12 and 3.14 before publish. Optional-extra tests
      # are marker-gated + pytest.importorskip, so they skip cleanly wherever
      # the extra is absent (core install).
      #
      # Coverage gate: the 3.12+all leg enforces the 60% floor from
      # pyproject.toml addopts. The 3.14+core and 3.14+all legs override to
      # --cov-fail-under=0 because importorskip-gated tests skip there (their
      # coverage sits at ~10-20%); a 60% gate on those legs would be
      # permanently red and block releases. pytest-cov uses the last
      # --cov-fail-under value, so the CLI override wins over addopts.
      - name: Run pytest (3.12+all — 60% coverage gate enforced)
        if: matrix.python-version == '3.12' && matrix.install-scope == 'all'
        run: uv run pytest -q
        env:
          CI: "true"   # hypothesis CI profile auto-activates
      - name: Run pytest (3.14 legs — coverage gate disabled)
        if: "!(matrix.python-version == '3.12' && matrix.install-scope == 'all')"
        run: uv run pytest -q --cov-fail-under=0
        env:
          CI: "true"   # hypothesis CI profile auto-activates

  publish:
    needs: [lint, test]   # publish gated on lint + test
    # publish only gates on the GATING test legs (3.12+all, 3.14+core).
    # The 3.14+all best-effort leg has continue-on-error so it cannot block.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv python install 3.12
      - run: uv sync
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
