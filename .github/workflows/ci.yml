name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least-privilege default; no ci.yml job needs write access

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "lint-3.14"
          cache-python: true
          python-version: "3.14"   # lint on the highest supported version
      - run: uv sync                   # installs dev group (ruff, ty) + core deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      # ty is hard-gated: a non-zero ty exit fails the lint job. ty is
      # configured with error-on-warning = false, so only error-severity
      # diagnostics fail CI; warnings (third-party stub friction, numpy
      # ArrayLike union noise) are reported but non-gating.
      - run: uv run ty check

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        install-scope: ["core", "all"]
        # 3.12+all and 3.14+core are GATING; 3.14+all is BEST-EFFORT.
        # 3.12+core is redundant with 3.12+all (all includes core) — drop it
        # to keep the matrix at 3 jobs: 3.12+all, 3.14+core, 3.14+all.
        exclude:
          - python-version: "3.12"
            install-scope: "core"
        include:
          - python-version: "3.14"
            install-scope: "all"
            continue-on-error: true   # antspyx source build on 3.14 (no wheel) — non-gating
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error || false }}
    timeout-minutes: 30   # antspyx source build can be slow on a cache miss
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "${{ matrix.python-version }}-${{ matrix.install-scope }}"
          cache-python: true
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies (core)
        if: matrix.install-scope == 'core'
        run: uv sync --no-all-extras
      - name: Install dependencies (all extras — 3.12)
        if: matrix.install-scope == 'all' && matrix.python-version == '3.12'
        run: uv sync --extra all
      # 3.14+all: antspyx has no cp314 wheel and its source build fails
      # (statsmodels 0.9.0 / ITK / VTK C++ compile). Drop the antspy extra on
      # 3.14 and install only the ai extras so the leg still exercises torch.
      # The leg keeps continue-on-error: true (best-effort). Registration
      # tests on 3.14 are mock-only (see the -m "not antspy" flag below).
      - name: Install dependencies (ai extras only — 3.14, antspy dropped)
        if: matrix.install-scope == 'all' && matrix.python-version == '3.14'
        run: uv sync --extra ai
      # Run pytest on both 3.12 and 3.14 before publish. Optional-extra tests
      # are marker-gated + pytest.importorskip, so they skip cleanly wherever
      # the extra is absent (core install).
      #
      # Coverage gate: the 3.12+all leg enforces the 60% floor from
      # pyproject.toml addopts. The 3.14+core and 3.14+all legs override to
      # --cov-fail-under=0 because importorskip-gated tests skip there (their
      # coverage sits at ~10-20%); a 60% gate on those legs would be
      # permanently red and block releases. pytest-cov uses the last
      # --cov-fail-under value, so the CLI override wins over addopts.
      - name: Run pytest (3.12+all — 60% coverage gate enforced)
        if: matrix.python-version == '3.12' && matrix.install-scope == 'all'
        run: uv run pytest -q
        env:
          CI: "true"   # hypothesis CI profile auto-activates
      - name: Run pytest (3.14 legs — coverage gate disabled, antspy deselected)
        if: "!(matrix.python-version == '3.12' && matrix.install-scope == 'all')"
        # antspyx is not installed on 3.14 (no cp314 wheel), so the
        # @pytest.mark.antspy real round-trip tests are deselected. The
        # mock-orchestration registration tests are unmarked and still run.
        run: uv run pytest -q --cov-fail-under=0 -m "not antspy"
        env:
          CI: "true"   # hypothesis CI profile auto-activates
