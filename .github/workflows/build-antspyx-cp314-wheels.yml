name: Build antspyx cp314 wheels

# Build cp314 (Python 3.14) wheels for antspyx by checking out the upstream
# ANTsX/ANTsPy repo and compiling with cibuildwheel. The wheels are attached
# to a GitHub Release in THIS repo (tag: antspyx-cp314) so uv can consume them
# as a flat find-links index, letting the 3.14 CI leg install a prebuilt
# antspyx instead of source-building (which fails: no cp314 wheel on PyPI and
# the source build needs OpenBLAS/ITK unavailable in the default env).
#
# Why this is needed:
#   - Upstream ships cp310-cp313 wheels but has no cp314 matrix entries.
#   - The latest PyPI release (0.6.3) caps scipy<1.16; upstream master (0.6.4)
#     removed that cap (PR #900) but is unreleased.
#   - antspyx is Apache-2.0, so redistributing built wheels is permitted.
#
# Triggered manually (workflow_dispatch). Each platform is a parallel job;
# expect ~30-90 min per wheel (ITK/ANTs C++ compile). Re-running updates the
# antspyx-cp314 release in place (allowUpdates: true).

on:
  workflow_dispatch:
    inputs:
      antspy_ref:
        description: 'ANTsX/ANTsPy git ref to build from (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write # to create/update the antspyx-cp314 release + assets

concurrency:
  group: antspyx-cp314-wheels
  cancel-in-progress: false

jobs:
  build_wheels:
    name: cp314-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CIBW_HOST_PYTHON: '3.13'
      CIBW_DEFAULT_MANYLINUX_IMAGE: manylinux_2_28
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64-bit
          - os: windows-latest
            python: '3.14'
            cibw_python: 314
            platform_id: win_amd64
          # Linux x86_64
          - os: ubuntu-latest
            python: '3.14'
            cibw_python: 314
            platform_id: manylinux_x86_64
          # Linux ARM64 via native ARM runner
          - os: ubuntu-24.04-arm
            python: '3.14'
            cibw_python: 314
            arch: aarch64
            platform_id: manylinux_aarch64
          # macOS Intel 64-bit
          - os: macos-15-intel
            python: '3.14'
            cibw_python: 314
            arch: x86_64
            platform_id: macosx_x86_64
          # macOS Apple Silicon 64-bit
          - os: macos-14
            python: '3.14'
            cibw_python: 314
            arch: arm64
            platform_id: macosx_arm64

    steps:
      - name: Checkout upstream ANTsX/ANTsPy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ANTsX/ANTsPy
          ref: ${{ inputs.antspy_ref }}
          submodules: true

      - name: Install Python host for cibuildwheel
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.CIBW_HOST_PYTHON }}

      - name: Set up MSVC x64
        if: matrix.platform_id == 'win_amd64'
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1

      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install "cibuildwheel==4.2.0" setuptools toml

      - name: Get package version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$( python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])" )" >> $GITHUB_ENV

      - name: Read pinned ITK tag (cache key input)
        shell: bash
        run: |
          itk_tag=$(grep -E '^itktag=' scripts/configure_ITK.sh | head -1 | cut -d'=' -f2 | awk '{print $1}')
          echo "ITK_TAG=${itk_tag}" >> $GITHUB_ENV
          echo "Pinned ITK tag: ${itk_tag}"

      - name: Set cibuildwheel cache path
        shell: bash
        run: |
          set -euxo pipefail
          cache_dir="${RUNNER_TEMP}/cibw-cache"
          mkdir -p "${cache_dir}"
          echo "CIBW_CACHE_PATH=${cache_dir}" >> "${GITHUB_ENV}"

      # Cache the compiled ITK build + source tree. ITK is the expensive part
      # (~30-60 min C++ compile) and is pinned to a fixed tag in
      # scripts/configure_ITK.sh, so the cache is keyed on that tag + OS + arch
      # and only invalidates when upstream bumps ITK. configure_ITK.sh is
      # idempotent: it skips cloning/building if itksource/ and itkbuild/ already
      # exist, so a cache hit skips the entire ITK compile. cibuildwheel mounts
      # the project dir into the Linux container, so the cached dirs are visible
      # there too.
      - name: Cache ITK build tree
        id: itk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            itkbuild
            itksource
          key: itk-${{ matrix.platform_id }}-${{ env.ITK_TAG }}
          restore-keys: |
            itk-${{ matrix.platform_id }}-

      - name: Cache cibuildwheel + scikit-build build dirs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CIBW_CACHE_PATH }}
            build
          key: cibw-${{ matrix.platform_id }}-${{ env.PACKAGE_VERSION }}-${{ env.ITK_TAG }}
          restore-keys: |
            cibw-${{ matrix.platform_id }}-${{ env.PACKAGE_VERSION }}-
            cibw-${{ matrix.platform_id }}-

      - name: Determine macOS deployment target
        if: startsWith(matrix.os, 'macos-')
        run: |
          macos_version=$(sw_vers -productVersion | awk -F '.' '{print $1".0"}')
          echo "MACOSX_DEPLOYMENT_TARGET=${macos_version}" >> $GITHUB_ENV

      - name: Build wheels
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ env.CIBW_DEFAULT_MANYLINUX_IMAGE }}
          CIBW_BUILD: cp${{ matrix.cibw_python }}-${{ matrix.platform_id }}
          CIBW_TEST_SKIP: "cp*" # install/test is handled in the next step
          CIBW_BEFORE_ALL_LINUX: |
            echo "Installing system dependencies with yum"
            yum install -y gcc-c++ libpng-devel libpng
            echo "pip installing cmake and ninja"
            python -m pip install cmake ninja setuptools SimpleITK==2.4.1 nibabel
          CIBW_BEFORE_ALL_WINDOWS: |
            python -m pip install cmake ninja setuptools SimpleITK nibabel
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: |
            CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} CMAKE_PREFIX_PATH=/usr/local
          CIBW_BEFORE_ALL_MACOS: |
            python -m pip install cmake ninja setuptools SimpleITK nibabel
            if ! brew list libpng &>/dev/null; then
                HOMEBREW_NO_AUTO_UPDATE=1 brew install libpng
            fi
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Set up target Python for testing (Linux / Mac)
        if: ${{ ! startsWith(matrix.os, 'windows-') }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test the built wheel (Linux / Mac)
        if: ${{ ! startsWith(matrix.os, 'windows-') }}
        run: |
          python -m pip install wheelhouse/*.whl
          tests/run_tests.sh

      - name: Set up target Python for testing (Windows)
        if: startsWith(matrix.os, 'windows-')
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test the built wheel (Windows)
        if: startsWith(matrix.os, 'windows-')
        shell: cmd
        run: |
          python -m pip install --find-links=./wheelhouse antspyx
          bash tests/run_tests.sh

      - name: Upload debug artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-cp314-${{ matrix.platform_id }}
          path: |
            wheelhouse/**
            ./**/*.log
            ./**/CMakeCache.txt
          if-no-files-found: warn

      - name: Upload wheels as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-cp314-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish_release:
    name: Publish wheels + flat index to antspyx-cp314 release
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-cp314-*
          merge-multiple: true
          path: wheelhouse

      - name: Generate uv flat index (index.html)
        run: |
          set -euxo pipefail
          cd wheelhouse
          python3 - <<'PY'
          import os, html, hashlib
          files = sorted(f for f in os.listdir(".") if f.endswith(".whl"))
          assert files, "no wheels found"
          with open("index.html", "w") as f:
              f.write("<!DOCTYPE html>\n<html>\n<body>\n")
              for fn in files:
                  data = open(fn, "rb").read()
                  digest = hashlib.sha256(data).hexdigest()
                  f.write(f'<a href="{html.escape(fn)}#sha256={digest}" data-requires-python="&gt;=3.14">{html.escape(fn)}</a><br/>\n')
              f.write("</body>\n</html>\n")
          print(f"indexed {len(files)} wheels")
          PY
          ls -la index.html *.whl

      - name: Attach wheels + index to antspyx-cp314 release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          tag: antspyx-cp314
          name: antspyx cp314 wheels
          body: |
            Prebuilt cp314 (Python 3.14) wheels for antspyx, built from ANTsX/ANTsPy ${{ inputs.antspy_ref }}.

            These exist because upstream has not added cp314 to its build matrix and the latest PyPI release (0.6.3) caps scipy<1.16. Consumed by liom-toolkit via a uv flat index pointing at this release's index.html asset.
          artifacts: wheelhouse/*.whl,wheelhouse/index.html
          token: ${{ secrets.GITHUB_TOKEN }}
