name: Release

# Tag-triggered release: cutting a release = `git tag v1.0.0 && git push --tags`.
# The publish job moved OUT of ci.yml so main pushes stop attempting PyPI
# re-uploads (PyPI rejects re-uploads of an unchanged version — the root
# cause of the silent red publish jobs during modernization). A separate
# github-release job is gated on publish success so a failed PyPI upload
# cannot create an orphan GitHub Release.
#
# IMPORTANT: this workflow is tag-triggered and does NOT gate on the CI
# workflow (no `workflow_run` dependency). The publish job uploads to PyPI
# regardless of whether CI is green or red. Before cutting a release tag,
# the operator MUST verify that the CI workflow on the commit being tagged
# is fully green (especially the gating 3.12+all leg). Shipping a
# 5-Production/Stable release from a red CI commit violates the pre-release
# confidence gate.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags to derive the version
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv python install 3.12
      - run: uv sync
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  github-release:
    needs: publish   # gate: do not create a GitHub Release if PyPI upload failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog section
        run: |
          # Extract the changelog section matching the tag's version into a
          # release notes file. The version is derived from the git tag
          # (GITHUB_REF_NAME, e.g. "v1.0.0" -> "1.0.0"). The awk script sets a
          # flag at the matching "## [ver]" header and prints until the next
          # "## [" header is seen. `first` is set BEFORE the exit check so the
          # first matching header sets the flag and the SECOND "## [" header
          # triggers the exit (the original exit-before-flag bug produced an
          # empty file). awk `-v` does NOT interpolate inside /regex/, so the
          # header match uses index($0, "## [" ver "]") == 1 instead.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" 'index($0,"## ["ver"]")==1{flag=1} /^## \[/{if(flag){if(first){exit}; first=1}} flag' \
            CHANGELOG.md > /tmp/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
