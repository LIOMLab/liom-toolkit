name: Release

# Tag-triggered release: cutting a release = `git tag v1.0.0 && git push --tags`.
# The publish job moved OUT of ci.yml so main pushes stop attempting PyPI
# re-uploads (PyPI rejects re-uploads of an unchanged version — the root
# cause of the silent red publish jobs during modernization). A separate
# github-release job is gated on publish success so a failed PyPI upload
# cannot create an orphan GitHub Release.
#
# CI gating: the lint + test jobs re-run the CI gates on the tagged commit
# and publish is gated on their success (needs: [lint, test]). This verifies
# the EXACT commit being shipped, not just "CI was green on main at some
# point." The gating legs mirror ci.yml: lint (ruff + ty on 3.14), then a
# 2-leg test matrix (3.12+all, 3.14+all) — both with all extras (ai + antspy)
# and the 60% coverage gate.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release in progress — could leave PyPI/GitHub in a partial state

permissions:
  contents: read   # least-privilege default; per-job overrides below grant write where needed

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "lint-3.14-release"
          cache-python: true
          python-version: "3.14"   # lint on the highest supported version
      - run: uv sync                   # installs dev group (ruff, ty) + core deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  test:
    needs: lint
    strategy:
      fail-fast: true   # a release gate should fail fast — no point running 3.14 if 3.12 is red
      matrix:
        # Two gating legs, both with all extras (ai + antspy) — mirrors ci.yml.
        #   3.12+all — antspyx 0.6.3 from PyPI (cp312 wheel)
        #   3.14+all — antspyx 0.6.4 from this repo's antspyx-cp314 wheel release
        # Both legs enforce the 60% coverage gate from pyproject.toml addopts.
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags for dynamic-version metadata extraction during uv sync
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "${{ matrix.python-version }}-all-release"
          cache-python: true
          python-version: "${{ matrix.python-version }}"
      - run: uv sync --extra all
      - run: uv run pytest -q
        env:
          CI: "true"   # hypothesis CI profile auto-activates

  publish:
    needs: [lint, test]   # CI gate: do not publish if lint or tests fail on the tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi   # gates the job behind an environment (protection rules can be added later; required for future trusted-publishing switch)
    permissions:
      contents: read   # PyPI upload uses the token secret, not the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          # No enable-cache: the default 'auto' disables cache for tag-push
          # events, which avoids cache poisoning on release builds.
      - run: uv sync
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # TODO(follow-up): switch to PyPI trusted publishing (OIDC) once a trusted
          # publisher is configured on PyPI. That removes the PYPI_TOKEN secret and
          # requires permissions: id-token: write + environment: pypi on this job.

  github-release:
    needs: publish   # gate: do not create a GitHub Release if PyPI upload failed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # creates a GitHub Release — requires write access to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog section
        run: |
          # Extract the changelog section matching the tag's version into a
          # release notes file. The version is derived from the git tag
          # (GITHUB_REF_NAME, e.g. "v1.0" -> "1.0"). The awk script sets a
          # flag at the matching "## [ver" header prefix and prints until the
          # next "## [" header is seen. Prefix matching handles the case where
          # the tag is "v1.0" but the CHANGELOG header is "## [1.0.0]" —
          # "## [1.0" is a prefix of "## [1.0.0]". `first` is set BEFORE the
          # exit check so the first matching header sets the flag and the
          # SECOND "## [" header triggers the exit.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" 'index($0,"## ["ver)==1{flag=1} /^## \[/{if(flag){if(first){exit}; first=1}} flag' \
            CHANGELOG.md > /tmp/release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
