[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "liom-toolkit"
readme = "README.md"
version = "2025.06.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Frederic Lesage", email = "frederic.lesage@polymtl.ca" },
    { name = "Frans Irgolitsch", email = "frans.irgolitsch@polymtl.ca" }
]
description = "LIOM Toolkit is a Python package for processing and analyzing microscopy data, providing tools for image segmentation, registration, and analysis."
keywords = ["bioinformatics", "neuroinformatics", "lightsheet", "microscopy", "liom", "segmentation", "registration", "image processing",
    "deep learning"]

dependencies = [
    'tqdm',
    'scikit-image>=0.26',
    'imageio>=2.30',
    'ome-zarr>=0.18.0',
    'nibabel',
    'zarr>=3.0',
    'h5py',
    'pynrrd',
    'pandas',
    'requests',
    'PyWavelets',
    'SimpleITK',
    'dask',
    "bokeh>=3.1.0", # Bokeh is used for the dask dashboard
    'distributed',
    'opencv-python',
    'natsort',
    "openpyxl>=3.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchvision",
    "timm",
    "einops",
    "wandb",
    "scikit-learn"
]
antspy = [
    'antspyx>=0.6.3',
]

all = [
    "liom_toolkit[ai]",
    "liom_toolkit[antspy]",
]

[dependency-groups]
dev = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-apidoc",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "hypothesis",
    "ruff>=0.16.4",
    "ty==0.0.74",
    "types-tqdm",
    "types-opencv-python>=1.0.11",
    "scipy-stubs",
    "pandas-stubs",
    "pyarrow>=25.0.1",
]

[project.scripts]
liom-convert-hdf5-to-zarr = "liom_toolkit.scripts.liom_convert_hdf5_to_zarr:main"
liom-create-mask = "liom_toolkit.scripts.liom_create_mask:main"

[project.urls]
Homepage = "https://github.com/LIOMLab/liom-toolkit"
Documentation = "https://liom-toolkit.readthedocs.io/"
Repository = "https://github.com/LIOMLab/liom-toolkit"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "-n", "auto",
    "--dist=loadscope",
    "--strict-markers",
    "--cov=liom_toolkit",
    "--cov-report=term-missing",
    "--cov-fail-under=60",
    # Coverage gate ratcheted to 60% with the Phase-2 TEST-01 suite; CI
    # overrides the gate to 0 on the 3.14+core and 3.14+all legs (see ci.yml)
    # because importorskip-gated tests skip there. Do NOT add a zero-value
    # coverage gate here: pytest-cov uses the last --cov-fail-under value and
    # addopts is prepended to the CLI, so a zero in addopts would defeat the
    # ratchet everywhere.
]
markers = [
    "ai: requires the ai extra (torch) - skip with -m 'not ai'",
    "antspy: requires the antspy extra (antspyx) - 3.12-only, skip with -m 'not antspy'",
    "slow: slow test, auto-deselected from fast iteration by convention",
]
# No blanket deprecation-warning filter: real third-party deprecations must
# surface so upcoming breaking dependency changes are visible. Add targeted
# filters (by message/module) here only when a specific noisy warning is
# observed during a test run.
filterwarnings = [
    # pynrrd 1.1.3 (latest) calls datetime.utcnow() inside nrrd.write
    # (nrrd/writer.py:148), which is deprecated in Python 3.12+. This is
    # purely upstream — we cannot fix nrrd's code and cannot upgrade
    # (already latest). Scope by exact message so any other nrrd
    # deprecation still surfaces. AGENTS.md §5 sanctions this targeted
    # filter for unfixable upstream deprecations.
    #
    # Note: Python's warnings filter matches the message with re.match
    # (anchored at the start), and the actual warning text begins
    # "datetime.datetime.utcnow() is deprecated" — the regex must include
    # the "datetime." prefix to match. A module scope cannot be used
    # because datetime.utcnow() raises the warning from C code (_datetime
    # module), so the warning's frame module is not nrrd.writer.
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"   # NOT py314 — load-bearing for 3.12 forward-ref support (from __future__ import annotations stays)
line-length = 100
# Sphinx conf.py manipulates sys.path before imports (E402) and uses its own
# formatting conventions; it is build tooling, not package code, so exclude it
# from ruff lint/format. CI runs `ruff check` / `ruff format --check` on `.`.
extend-exclude = ["docs"]

# Phase-7 ratchet: the auto-fixable Phase-1 subset is now expanded with the
# docstring/annotation rule families (D, DOC, ANN). The remaining expansive
# rule sets (S, N, A, ARG, PL, PTH, PERF, LOG, G, PGH, BLE, etc.) land in the
# final ratchet after the per-module docstring/annotation waves are done.
# CI runs `ruff check` + `ruff format --check` read-only.
[tool.ruff.lint]
# Phase-7 select: Phase-1 auto-fixable subset + D (pydocstyle) + DOC
# (pydoclint, preview) + ANN (flake8-annotations). DOC requires preview.
# UP037 (useless future import) does NOT fire under target-version = "py312",
# so `from __future__ import annotations` is preserved (load-bearing on 3.12).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "D", "DOC", "ANN"]
# Enable preview rules project-wide so DOC (pydoclint) is active. Non-DOC
# preview rules that fire are triaged below in `ignore` with justifications.
preview = true
# Formatter-conflicting rules MUST be ignored when using `ruff format`.
# Ratchet: the remaining ignores suppress non-auto-fixable violations.
# E501/B008/E721 ratchet debts were cleared in the prior wave (manual line
# breaks, deferred device default-arg, isinstance type comparison) and are
# no longer listed. T20 is suppressed until the Phase 8 LOG-01 print→logging
# sweep — T20 autofix is a deletion rule that would destroy user-facing
# print statements (AGENTS §2 violation); never enable T20 with --fix.
ignore = [
    "COM812",  # formatter conflict — permanent
    "ISC001",  # formatter conflict — permanent
    # ratchet: Phase 8 / LOG-01 — print()→logging migration; drop this line after the sweep
    "T20",
]

[tool.ruff.lint.per-file-ignores]
# Forward-looking: tests legitimately use `assert` (S101). S101 is not in the
# current select list, so production assert usage is not flagged yet. When
# S101 is enabled in the final ratchet, tests stay exempt via this entry.
"tests/**" = [
    "S101",   # assert is the idiomatic pytest assertion primitive
]
# Temporary: D/DOC not yet converted for these modules. Shrinks each wave as
# modules are converted to numpy-convention docstrings. Removed entirely in
# the final ratchet after the per-module docstring waves are done.
"liom_toolkit/conversion/**" = ["D", "DOC"]
"liom_toolkit/registration/**" = ["D", "DOC"]
"liom_toolkit/segmentation/**" = ["D", "DOC"]
"liom_toolkit/utils/**" = ["D", "DOC"]
"liom_toolkit/scripts/**" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
# defaults — line-length 100 inherited from [tool.ruff]

[tool.ty.rules]
# ty has no `strict = true` flag; setting every rule to "error" is the
# documented equivalent of strict mode.
all = "error"

[tool.ty.environment]
python-version = "3.12"   # match ruff target-version (>=3.12 floor)

# Optional deps (ants, patchify) ship no inline types and no stubs are
# installed in the base environment. replace-imports-with-any makes the
# entire ants.**/patchify.** surface `Any` AND unconditionally suppresses
# import diagnostics — strictly better than per-file import-error overrides
# overrides for untyped C++-binding libs (downstream attribute accesses no
# longer need inline `# ty: ignore` proliferation). patchify was removed
# from core deps but the entry is forward-looking.
[tool.ty.analysis]
replace-imports-with-any = ["ants.**", "patchify.**"]

# Warnings don't fail CI — only error diagnostics do. The CI ty step keeps
# continue-on-error: true until the annotation waves are done; the hard
# gate (removing continue-on-error) lands after all annotations are done.
[tool.ty.terminal]
error-on-warning = false

# PyTorch nn.Module dynamic attributes (self.layer = nn.Linear(...),
# register_buffer attrs) are a known cross-checker problem. Suppress
# possibly-missing-attribute and warn (not error) on unresolved-attribute
# so real attribute bugs surface without failing CI on the dynamic-attr
# false positives. Add explicit class-level annotations on nn.Module
# subclasses where feasible.
[[tool.ty.overrides]]
include = ["liom_toolkit/segmentation/vseg/**"]
rules = { possibly-missing-attribute = "ignore", unresolved-attribute = "warn" }

[tool.setuptools.package-data]
liom_toolkit = ["py.typed"]

