[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "liom-toolkit"
readme = "README.md"
version = "2025.06.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Frederic Lesage", email = "frederic.lesage@polymtl.ca" },
    { name = "Frans Irgolitsch", email = "frans.irgolitsch@polymtl.ca" }
]
description = "LIOM Toolkit is a Python package for processing and analyzing microscopy data, providing tools for image segmentation, registration, and analysis."
keywords = ["bioinformatics", "neuroinformatics", "lightsheet", "microscopy", "liom", "segmentation", "registration", "image processing",
    "deep learning"]

dependencies = [
    'tqdm',
    'scikit-image',
    'ome-zarr>=0.9.0',
    'nibabel',
    'zarr',
    'h5py',
    'pynrrd',
    'PyWavelets',
    'SimpleITK',
    'dask',
    "bokeh>=3.1.0", # Bokeh is used for the dask dashboard
    'distributed',
    'opencv-python',
    'patchify',
    'natsort',
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchvision",
    "timm",
    "einops",
    "wandb",
    "scikit-learn"
]
allensdk = [
    "allensdk",
]
antspy = [
    'antspyx>=0.5.3',
]

all = [
    "liom_toolkit[ai]",
    "liom_toolkit[antspy]",
    "liom_toolkit[allensdk]",
]

[dependency-groups]
dev = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-apidoc",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "hypothesis",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "types-tqdm",
    "types-opencv-python>=1.0.11",
    "scipy-stubs",
    "pandas-stubs",
]

[project.scripts]
liom-convert-hdf5-to-zarr = "liom_toolkit.scripts.liom_convert_hdf5_to_zarr:main"
liom-create-mask = "liom_toolkit.scripts.liom_create_mask:main"

[project.urls]
Homepage = "https://github.com/LIOMLab/liom-toolkit"
Documentation = "https://liom-toolkit.readthedocs.io/"
Repository = "https://github.com/LIOMLab/liom-toolkit"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "-n", "auto",
    "--dist=loadscope",
    "--strict-markers",
    "--cov=liom_toolkit",
    "--cov-report=term-missing",
    # Coverage gate is intentionally absent in Phase 1; ratchet to 60% once
    # the full test suite (TEST-01) lands in Phase 2.
]
markers = [
    "ai: requires the ai extra (torch) - skip with -m 'not ai'",
    "antspy: requires the antspy extra (antspyx) - 3.12-only, skip with -m 'not antspy'",
    "allensdk: requires the allensdk extra - skip with -m 'not allensdk'",
    "slow: slow test, auto-deselected from fast iteration by convention",
]
# No blanket deprecation-warning filter: real third-party deprecations must
# surface so upcoming breaking dependency changes are visible. Add targeted
# filters (by message/module) here only when a specific noisy warning is
# observed during a test run.
filterwarnings = []

[tool.ruff]
target-version = "py312"   # NOT py314 — load-bearing for 3.12 forward-ref support (from __future__ import annotations stays)
line-length = 100
# Sphinx conf.py manipulates sys.path before imports (E402) and uses its own
# formatting conventions; it is build tooling, not package code, so exclude it
# from ruff lint/format. CI runs `ruff check` / `ruff format --check` on `.`.
extend-exclude = ["docs"]

# Phase-1 strategy: enable the AUTO-FIXABLE rule subset now; the full
# expansive set (ANN, ARG, PL, S, N, D, etc.) is suppressed and ratcheted
# into the lint full-adoption phase (LINT-01). The Phase-1 select list
# bounds what the one-time `ruff check --fix --unsafe-fixes` rewrite can
# touch. CI runs `ruff check` + `ruff format --check` read-only.
[tool.ruff.lint]
# Phase-1 auto-fixable subset: E, F, W, I, UP, B, SIM, C4, RUF.
# UP037 (useless future import) does NOT fire under target-version = "py312",
# so `from __future__ import annotations` is preserved (load-bearing on 3.12).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# Formatter-conflicting rules MUST be ignored when using `ruff format`.
# Ratchet: the remaining ignores below suppress non-auto-fixable violations
# inside the Phase-1 select set. They are NOT permanent — each is tracked as
# ratchet debt and picked up by a later phase:
#   E501, B008, E721 ............ Phase 7 / LINT-01 (manual line breaks,
#                                 default-arg refactors, type-comparison fix)
#   B904 ....................... Phase 6 / BUG-01 (raise ... from err / None
#                                 when the assert->raise + exception-chain
#                                 work touches each raise site)
# See .planning/STATE.md "Open Gaps to Address" for the tracked debt list.
ignore = [
    "COM812",  # formatter conflict
    "ISC001",  # formatter conflict
    "E501",    # ratchet: Phase 7 / LINT-01 — long string/signature lines format can't break
    "B904",    # ratchet: Phase 6 / BUG-01 — raise-without-from (semantic, tied to assert->raise work)
    "B008",    # ratchet: Phase 7 / LINT-01 — torch.device in default args (semantic refactor)
    "E721",    # ratchet: Phase 7 / LINT-01 — type comparison (semantic)
]

[tool.ruff.lint.per-file-ignores]
# Forward-looking: tests legitimately use `assert` (S101). S101 is not in the
# Phase-1 select list above, so production assert usage is not flagged this
# phase. When S101 is enabled in the lint full-adoption phase, tests stay
# exempt via this entry.
"tests/**" = [
    "S101",   # assert is the idiomatic pytest assertion primitive
]
# Ratchet: package __init__.py files use `from .module import *` barrel
# re-exports (established pattern, AGENTS.md §7) and import optional deps
# (ants, torch) solely to check availability before re-raising ImportError
# with a user-facing message. Both trip F403/F401 but are intentional.
# Revisit in Phase 7 / LINT-01: replace barrel exports with explicit __all__,
# and in Phase 4 / DEP-02,03: convert availability checks to
# importlib.util.find_spec. See .planning/STATE.md "Open Gaps to Address".
"**/__init__.py" = [
    "F403",   # `from .module import *` barrel re-export — established pattern
    "F401",   # unused import: re-export surface OR optional-dep availability check
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
# defaults — line-length 100 inherited from [tool.ruff]

[tool.ty.rules]
# ty has no `strict = true` flag; setting every rule to "error" is the
# documented equivalent of strict mode.
all = "error"

[tool.ty.environment]
python-version = "3.12"   # match ruff target-version (>=3.12 floor)

# Optional deps (ants, allensdk, torch) ship no inline types and no stubs are
# installed in the base environment. These overrides silence
# `unresolved-import` for the modules that guard those imports with
# try/except ImportError at runtime. Baseline-only in this phase — NOT
# CI-gated (gating deferred to the lint/typing full-adoption phase).
[[tool.ty.overrides]]
include = ["liom_toolkit/registration/**", "liom_toolkit/utils/ants.py", "liom_toolkit/utils/allen_sdk.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["liom_toolkit/segmentation/vseg/**"]
rules = { unresolved-import = "ignore" }

[tool.setuptools.package-data]
liom_toolkit = ["py.typed"]

